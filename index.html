<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>โปรแกรมสร้างสลากการกุศลโรงเรียนบ้านหนองสังข์</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Sarabun,'Noto Sans Thai',Tahoma,sans-serif;background:#e9ecf1;color:#222;display:flex;min-height:100vh}
#side{width:380px;background:#fff;padding:14px;overflow-y:auto;height:100vh;position:sticky;top:0;border-right:1px solid #ccd}
#side h1{font-size:18px;margin:0 0 8px;color:#1d3f9b}
#side h2{font-size:14px;margin:14px 0 6px;border-bottom:2px solid #1d3f9b;padding-bottom:2px}
label{display:block;font-size:12px;margin:6px 0 2px;color:#555}
input,textarea{width:100%;font:inherit;font-size:13px;padding:5px 7px;border:1px solid #bbc;border-radius:5px}
textarea{resize:vertical}
.g{display:flex;gap:6px}.g>*{flex:1}
.pr{display:grid;grid-template-columns:3fr 2fr 2.5fr 28px;gap:4px;margin-bottom:4px}
button{font:inherit;font-size:13px;padding:7px 10px;border:0;border-radius:6px;background:#1d3f9b;color:#fff;cursor:pointer}
button.s{background:#e3e7f2;color:#123}button:disabled{opacity:.5}
#msg{font-size:12px;color:#c00;margin-top:6px;min-height:16px}
#prev{flex:1;padding:16px;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px}
.page{width:210mm;height:297mm;background:#fff;padding:10mm;display:flex;flex-direction:column;box-shadow:0 1px 6px #0003}
#prev .page{zoom:.75}
.tk{flex:1;min-height:0;display:flex;border:.3mm solid #222;font-size:9pt;line-height:1.25}
.tk+.tk{border-top:0}
.stub{width:62mm;border-right:.3mm dashed #222;padding:2mm 2.5mm;text-align:center;display:flex;flex-direction:column;justify-content:space-between}
.stub .t{font-size:13pt}
.main{flex:1;position:relative;padding:2mm 3mm;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.main>*{position:relative}
.wm{position:absolute!important;left:50%;top:50%;height:38mm;transform:translate(-50%,-50%);opacity:.13}
.no{color:var(--c);font-weight:700;font-size:19pt;line-height:1}
.stub .no{font-size:17pt}
.h{text-align:center;font-weight:700;font-size:10pt}
.row{display:flex;justify-content:space-between;align-items:center}
.red{color:var(--c);font-size:8pt}
.pz{display:grid;grid-template-columns:2.4fr 1fr 1.4fr;font-size:8.5pt;column-gap:2mm}
.ln{display:flex;gap:1mm;text-align:left}.ln i{flex:1;border-bottom:.3mm dotted #000}
.ct{font-size:7.5pt;text-align:center}
#host{position:fixed;left:-9999px;top:0}
#pa{display:none}
@media print{
 @page{size:A4;margin:0}
 body{display:block;background:#fff}body>*:not(#pa){display:none!important}
 #pa{display:block}#pa .page{box-shadow:none;page-break-after:always}
}
@media(max-width:800px){body{flex-direction:column}#side{width:100%;height:auto;position:static}}

<div id="side">
<h1>🎫 โปรแกรมสร้างสลากการกุศลโรงเรียนบ้านหนองสังข์</h1>
<div id="f"></div>
<h2>รางวัล (แก้ไข/เพิ่ม/ลบได้)</h2>
<div id="pz"></div>

<div id="msg"></div>
<h2>อื่น ๆ</h2>
<label>เปลี่ยนโลโก้</label><input type="file" accept="image/*" onchange="logo(this)">
<button class="s" style="margin-top:8px" onclick="if(confirm('คืนค่าเริ่มต้นทั้งหมด?')){localStorage.removeItem('lot');location.reload()}">รีเซ็ตค่าเริ่มต้น</button>
<p style="font-size:11px;color:#777">ข้อมูลที่แก้ไขถูกเก็บในเบราว์เซอร์เครื่องนี้อัตโนมัติ</p>
<p style="font-size:12px;color:#1d3f9b;text-align:center;margin-top:16px;padding-top:8px;border-top:1px solid #dde">พัฒนาโดย ครูเจตดิลก ถายา · โรงเรียนบ้านหนองสังข์</p>
</div>

let D;try{D={...DEF,...JSON.parse(localStorage.getItem('lot')||'{}')}}catch(e){D={...DEF}}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem('lot',JSON.stringify(D))}catch(e){}};
const FIELDS=[['title','ชื่อสลาก','i'],['school','ชื่อโรงเรียน/หน่วยงาน','i'],['place','ที่ตั้ง (อำเภอ จังหวัด)','i'],['date','งวดประจำวันที่','i'],
['purpose','วัตถุประสงค์','t'],['rule','ข้อความเงื่อนไข','t'],['price','ราคา (บาท)','i'],['contact','ข้อความติดต่อรับรางวัล','t'],
['start','เลขเริ่มต้น','n'],['end','เลขสุดท้าย','n'],['per','จำนวนใบต่อ 1 ชุด','n'],['book','เล่มที่ (กรณีกำหนดเอง)','i']];
function buildForm(){
 $('f').innerHTML=FIELDS.map(([k,l,t])=>`<label>${l}</label>`+(t=='t'?`<textarea rows=2 data-k="${k}">${esc(D[k])}</textarea>`:`<input data-k="${k}" type="${t=='n'?'number':'text'}" value="${esc(D[k])}">`)).join('')
 +`<label><input type="checkbox" id="ab" ${D.autoBook=='1'?'checked':''} style="width:auto"> เล่มที่ = ลำดับของชุดโดยอัตโนมัติ</label><label>สีเลขที่สลาก</label><input type="color" data-k="color" value="${D.color}">`;
 $('f').oninput=e=>{const k=e.target.dataset.k;if(!k)return;D[k]=e.target.type=='number'?+e.target.value:e.target.value;save();refresh()};
 $('ab').onchange=e=>{D.autoBook=e.target.checked?'1':'0';save();refresh()};
 buildP();
}
function buildP(){
 $('pz').innerHTML=D.prizes.map((p,i)=>`<div class="pr">${[0,1,2].map(j=>`<input value="${esc(p[j])}" placeholder="${['เงื่อนไข','รางวัลที่','ได้รับ'][j]}" oninput="D.prizes[${i}][${j}]=this.value;save();refresh()">`).join('')}<button class="s" onclick="D.prizes.splice(${i},1);save();buildP();refresh()">✕</button></div>`).join('');
}
function addP(){D.prizes.push(['','','']);save();buildP();refresh()}
function logo(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{D.logo=r.result;save();refresh()};r.readAsDataURL(f)}
const sets=()=>Math.max(1,Math.ceil((D.end-D.start+1)/D.per));
const pad=n=>String(n).padStart(String(Math.max(D.end,0)).length,'0');
function tk(n,s){
 const no=pad(n),bk=D.autoBook=='1'?String(s).padStart(2,'0'):esc(D.book);
 return `<div class="tk" style="--c:${D.color}"><div class="stub"><div>เล่มที่ ${bk}</div><b class="t">${esc(D.title)}</b><div>${esc(D.school)}</div>
<div>เลขที่ <span class="no">${no}</span></div><div>งวดประจำวันที่ ${esc(D.date)}</div>
<div class="ln"><b>ชื่อ</b><i></i></div><div class="ln"><b>เบอร์โทร</b><i></i></div><div class="red">*${esc(D.rule)}*</div></div>
<div class="main"><img class="wm" src="${D.logo}"><div class="h">${esc(D.title)} ${esc(D.school)} ${esc(D.place)}</div>
<div class="row"><span>เลขที่ <span class="no">${no}</span></span><span>งวดประจำวันที่ ${esc(D.date)}</span><span>ราคา <b style="font-size:13pt">${esc(D.price)}</b> บาท</span></div>
<div style="text-align:center">${esc(D.purpose)}<br><span class="red">${esc(D.rule)}</span></div>
<div class="pz">${D.prizes.map(p=>`<span>${esc(p[0])}</span><span>${esc(p[1])}</span><b>${esc(p[2])}</b>`).join('')}</div>
<div class="ct">${esc(D.contact)}</div></div></div>`;
}
function pages(s){
 const list=[];for(let i=0;i<D.per;i++){const n=D.start+(s-1)*D.per+i;if(n>D.end)break;list.push(tk(n,s))}
 let h='';for(let i=0;i<list.length;i+=5)h+=`<div class="page">${list.slice(i,i+5).join('')}</div>`;return h;
}
function range(){const t=sets();let a=Math.round(+$('a').value)||1,b=Math.round(+$('b').value)||a;a=Math.min(Math.max(1,a),t);b=Math.min(Math.max(a,b),t);return[a,b,t]}
function refresh(){
 const[a,b,t]=range();$('info').textContent=`ทั้งหมด ${t} ชุด (เลข ${pad(D.start)}–${pad(D.end)}) · ชุดที่ ${a} = เลข ${pad(D.start+(a-1)*D.per)}–${pad(Math.min(D.end,D.start+a*D.per-1))}`;
 $('prev').innerHTML=pages(a);
}
$('a').oninput=$('b').oninput=refresh;
const wait=async()=>{try{await document.fonts.ready}catch(e){}await new Promise(r=>setTimeout(r,150))};
async function mkPdf(){
 const[a,b]=range(),sep=document.querySelector('input[name=m]:checked').value=='sep',m=$('msg');
 if(!window.jspdf||!window.html2canvas){m.textContent='โหลดไลบรารี PDF ไม่ได้ (ต้องต่ออินเทอร์เน็ต) ลองใช้ปุ่มพิมพ์แล้วเลือก "บันทึกเป็น PDF"';return}
 $('bp').disabled=true;m.style.color='#333';let doc=null,n=0;
 try{
 for(let s=a;s<=b;s++){
  if(!doc){doc=new jspdf.jsPDF({unit:'mm',format:'a4'});n=0}
  $('host').innerHTML=pages(s);await wait();
  for(const p of $('host').children){
   m.textContent=`กำลังสร้าง PDF… ชุดที่ ${s} (${s-a+1}/${b-a+1})`;
   const c=await html2canvas(p,{scale:2,useCORS:true,backgroundColor:'#fff'});
   if(n++)doc.addPage();doc.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297);
  }
  if(sep){doc.save(`สลาก-ชุดที่${s}.pdf`);doc=null;await new Promise(r=>setTimeout(r,400))}
 }
 if(doc)doc.save(`สลาก-ชุดที่${a}-${b}.pdf`);
 m.textContent='เสร็จแล้ว ✔';
 }catch(e){m.style.color='#c00';m.textContent='เกิดข้อผิดพลาด: '+e.message}
 $('host').innerHTML='';$('bp').disabled=false;
}
async function prt(){
 const[a,b]=range();let h='';for(let s=a;s<=b;s++)h+=pages(s);
 $('pa').innerHTML=h;await wait();window.print();setTimeout(()=>$('pa').innerHTML='',500);
}
buildForm();refresh();
</script></body></html>
